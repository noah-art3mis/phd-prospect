name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      # The same check the container healthcheck runs: configuration is complete and the
      # database opens. Catches a boot break that the unit tests would not, since they
      # exercise the modules rather than the entry point.
      - name: Boot
        run: node src/index.cjs --check
        env:
          TELEGRAM_BOT_TOKEN: ci-not-a-real-token
          TELEGRAM_ALLOWED_USER_ID: "1"
          ANTHROPIC_API_KEY: ci-not-a-real-key
          TZ: America/Mexico_City
          REMINDER_LEAD_TIMES: 30,7,1
          REMINDER_SEND_HOUR: "9"
          GCS_BACKUP_BUCKET: ci-not-a-real-bucket
          DB_PATH: ${{ runner.temp }}/prospect.db
