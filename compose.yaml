# One service. No published ports, no reverse proxy, no sidecar – long polling means nothing
# dials in, so there is nothing to expose and nothing to authenticate at the edge.

services:
  prospect:
    build: .
    restart: unless-stopped

    # The database lives on the host, so it survives the container being rebuilt, and the
    # backup job's copies land somewhere a person can scp them from.
    volumes:
      - ./data:/data

    env_file: .env

    # The container's clock reads UTC regardless; TZ is what the app resolves deadlines and
    # schedules jobs against, and it comes from the same .env the app validates at boot.
    environment:
      - DB_PATH=/data/prospect.db

    # A shared-core e2-micro has 1 GB of RAM and no swap by default. Capping the heap keeps a
    # runaway from taking the instance down with it, which would look like the app dying
    # silently – the thing the whole alerting design exists to prevent.
    mem_limit: 512m
    init: true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
